[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "jmap-calendar-mcp"
version = "0.2.0"
description = "MCP server that lets AI agents read, create and update calendar events on any JMAP server (Stalwart and others)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Robert O'Neill" }]
keywords = ["mcp", "jmap", "calendar", "stalwart", "jscalendar"]
classifiers = ["Programming Language :: Python :: 3", "Topic :: Office/Business :: Scheduling"]

[project.urls]
Homepage = "https://github.com/robertdoneill/jmap-calendar-mcp"
Issues = "https://github.com/robertdoneill/jmap-calendar-mcp/issues"

[project.scripts]
jmap-calendar-mcp = "jmap_calendar_mcp:main"

[tool.setuptools]
py-modules = ["jmap_calendar_mcp"]
